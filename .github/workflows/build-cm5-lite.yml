name: Build ImmortalWrt for Radxa CM5 Lite

on:
  push:
    branches:
      - cm5-lite
  workflow_dispatch:

concurrency:
  group: cm5-lite-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout board overlay
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3 rsync unzip \
            zlib1g-dev file wget ccache libelf-dev

      - name: Clone ImmortalWrt
        run: |
          git clone --depth 1 --branch master \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          git -C openwrt log -1 --format='%H %s'

      - name: Apply board support
        run: |
          set -eu
          DTS_DIR=openwrt/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip
          mkdir -p "$DTS_DIR"
          cp cm5lite/rk3588s-radxa-cm5.dtsi "$DTS_DIR/"
          cp cm5lite/rk3588s-radxa-cm5-lite-asm1184e.dts "$DTS_DIR/"
          cat cm5lite/armv8-device.mk >> openwrt/target/linux/rockchip/image/armv8.mk
          cat cm5lite/kernel-fragment.config >> openwrt/target/linux/rockchip/armv8/config-6.18
          # The generic config disables DRM and the onboard hub driver.
          # Drop those negative entries so the fragment above wins.
          sed -i \
            -e '/# CONFIG_DRM is not set/d' \
            -e '/# CONFIG_DRM_ROCKCHIP is not set/d' \
            -e '/# CONFIG_USB_ONBOARD_DEV is not set/d' \
            openwrt/target/linux/generic/config-6.18

      - name: Configure firmware
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_radxa_cm5_lite_asm1184e=y
          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=512
          CONFIG_PACKAGE_luci=y
          EOF
          make defconfig
          echo '--- selected device ---'
          grep -E 'CONFIG_TARGET_rockchip_armv8_DEVICE|CONFIG_PACKAGE_luci=' .config

      - name: Download sources
        run: |
          cd openwrt
          make -j"$(nproc)" download

      - name: Build
        run: |
          cd openwrt
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-rockchip-armv8-radxa_cm5_lite
          path: |
            openwrt/bin/targets/rockchip/armv8/*.img.gz
            openwrt/bin/targets/rockchip/armv8/*.sha256
            openwrt/bin/targets/rockchip/armv8/*.manifest
            openwrt/bin/targets/rockchip/armv8/*.buildinfo
          if-no-files-found: warn

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log
          if-no-files-found: warn
